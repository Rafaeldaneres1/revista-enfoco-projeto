<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https: http://127.0.0.1:8000 http://localhost:8000;
      media-src 'self' https:;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Revista Enfoco, publicação digital de Santa Maria - RS com notícias, colunas, agenda e edições especiais."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700;800;900&display=swap"
      />
    </noscript>
    <link rel="dns-prefetch" href="//revista-enfoco-api.onrender.com" />
    <link rel="preconnect" href="https://revista-enfoco-api.onrender.com" crossorigin="anonymous" fetchpriority="high" />
    <link rel="dns-prefetch" href="//res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin="anonymous" />
    <script>
      (function () {
        var configuredBackend = '%VITE_BACKEND_URL%';
        if (!configuredBackend || configuredBackend.indexOf('%VITE_') === 0) {
          return;
        }

        var backendUrl = configuredBackend.replace(/\/$/, '');
        var responsiveWidths = [320, 480, 640, 768, 960, 1200, 1600, 1920, 2560, 3200];
        var isCloudinaryImage = function (url) {
          return /^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//i.test(url || '');
        };
        var buildHeroUrl = function (url, width) {
          return url.replace(
            '/image/upload/',
            '/image/upload/f_auto,q_auto:eco,c_limit,w_' + width + '/'
          );
        };

        window.__ENFOCO_HOME_BOOTSTRAP_PROMISE__ = fetch(backendUrl + '/api/home-lite', {
          credentials: 'include',
          headers: { Accept: 'application/json' }
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Home bootstrap failed');
            }
            return response.json();
          })
          .then(function (data) {
            var firstHero = data && data.hero_posts && data.hero_posts[0];
            var heroImage = firstHero && firstHero.featured_image;

            if (heroImage && !document.querySelector('link[data-enfoco-hero-preload]')) {
              var preload = document.createElement('link');
              preload.rel = 'preload';
              preload.as = 'image';
              preload.href = heroImage;
              preload.setAttribute('fetchpriority', 'high');
              preload.setAttribute('data-enfoco-hero-preload', 'true');

              if (isCloudinaryImage(heroImage)) {
                preload.setAttribute(
                  'imagesrcset',
                  responsiveWidths
                    .map(function (width) {
                      return buildHeroUrl(heroImage, width) + ' ' + width + 'w';
                    })
                    .join(', ')
                );
                preload.setAttribute('imagesizes', '100vw');
              }

              document.head.appendChild(preload);
            }

            return data;
          })
          .catch(function () {
            return null;
          });
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <title>Revista Enfoco | Santa Maria RS</title>
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.error instanceof DOMException &&
            event.error.name === 'DataCloneError' &&
            event.message &&
            event.message.includes('PerformanceServerTiming')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para abrir a Revista Enfoco.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
